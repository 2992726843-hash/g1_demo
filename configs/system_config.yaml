robot:
  ip: "10.68.182.180"       # 你电脑真实IP ；无限连接机器人是：“ip: "机器人当前无线IP"”
  network_interface: "enp108s0" # 无线时："wlo1"；有线时“enp108s0”
  # 注：网络接口名称可能因设备而异，请根据实际情况修改，可以问ai进行调整，获取到网络接口名称

home_assistant:
  url: "http://127.0.0.1:8123"
  token: "your_token_here"

mode: "mock" # 开发用 mock，真机运行改成 real

# 新增 LLM 配置
llm:
  # 阿里云通义千问 API (OpenAI 兼容格式)
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1" 
  api_key: "sk-107dd8da7c7649049e36c82120a6ede6"  # 阿里云通义千问API密钥（可更改为实际有效的API密钥）
  model_name: "qwen-plus"  # 阿里云通义千问模型名称（可更改为实际有效的模型名称）

# -----------------------------
# 语音模块（PC 端基础版）
# -----------------------------
speech:
  enabled: true

  # text / voice / hybrid
  input_mode: "hybrid"

  # fixed 表示按回车后录固定秒数
  record_mode: "fixed"
  record_seconds: 4
  sample_rate: 16000
  channels: 1
  language: "zh"

  # 如果为 null，使用系统默认麦克风
  input_device: null

  asr:
    backend: "faster_whisper"
    model_size: "small"
    device: "auto"
    compute_type: "auto"

  tts:
    enabled: true
    backend: "pyttsx3"
    rate: 150
    volume: 1.0

  fallback:
    text_input_on_asr_fail: true
    print_reply_if_tts_fail: true