# ============================================================
# G1 适老化智能家居系统 - 主配置
# ============================================================
# 说明：
# - PC 端负责 ASR / LLM / 状态机 / 任务编排。
# - G1 HTTP 代理只负责把 PC 发来的动作或 TTS 请求转成 G1 本机 SDK 调用。
# - 本文件含 API Key / Token 等敏感信息，不建议提交到公开仓库。
# ============================================================


# ============================================================
# 1. 机器人与 G1 HTTP 代理
# ============================================================
robot:
  # 兼容旧的 local_sdk 路径。当前 HTTP 代理链路主要使用 proxy_base_url。
  ip: "192.168.1.114"

  # PC 本机用于 DDS/local_sdk 的网卡名；http_proxy 模式一般不依赖它。
  # 常见：有线 enp108s0/eth0，WiFi wlo1/wlan0。
  network_interface: "enp108s0"

  # 机器人动作控制后端：
  # - local_sdk：PC 直接通过 Unitree SDK2/DDS 控制 G1
  # - http_proxy：PC 调用运行在 G1 本机的 HTTP 代理
  control_backend: "http_proxy"

  # G1 本机 HTTP 代理地址。必须写完整 URL：协议 + IP + 端口。
  # 正确示例：http://192.168.1.114:9001  http://192.168.10.104:9001
  # 错误示例：192.168.1.114
  proxy_base_url: "http://192.168.10.104:9001"
  proxy_timeout_s: 3


# ============================================================
# 2. 系统运行模式
# ============================================================
# mock：不执行真实机器人动作，适合只测语音、LLM、IoT、主控流程。
# real：执行真实机器人动作；如果 robot.control_backend=http_proxy，则走 G1 HTTP 代理。
mode: "real"


# ============================================================
# 2.1 调试与性能诊断
# ============================================================
debug:
  # 打印 [PERF] 分段耗时日志，用于定位语音交互延迟瓶颈。
  perf_log: false
  # 比赛演示关闭详细过程日志；调试时可改回 true。
  verbose_log: false
  task_step_log: false
  asr_detail_log: false


# ============================================================
# 3. 紧急流程
# ============================================================
emergency:
  # 跌倒报警默认只执行 safe_stop，不排队执行机器人手势。
  # 演示时如确实需要手势，再临时改为 true。
  fall_robot_action_enabled: true
  fall_robot_action: "hands_up"


# ============================================================
# 4. Home Assistant
# ============================================================
home_assistant:
  # Home Assistant REST API 地址。
  url: "http://192.168.122.5:8123"

  # Long-Lived Access Token，敏感信息。
  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmMmQyNzBhMWY1YmM0YWUxODQ0ZTBkZGEzZGZhMGQzZCIsImlhdCI6MTc3NzAyNTIxNCwiZXhwIjoyMDkyMzg1MjE0fQ._7i5W7m8ZLtI5hNpUZCy9OWiqJeJPak7kGLSD3u2A1k"


# ============================================================
# 5. LLM 大模型
# ============================================================
llm:
  # DashScope OpenAI-compatible 接口。
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

  # 敏感信息。后续建议改成从环境变量读取。
  api_key: "sk-68f04f2f2d764bf49157412159bf8cc1"

  # qwen-plus 综合效果较好；qwen-turbo 更快更便宜。
  model_name: "qwen-plus"


# ============================================================
# 6. 语音模块
# ============================================================
speech:
  enabled: true

  # 输入模式：
  # - text/manual：键盘输入，最稳，适合调试
  # - voice/speech：只用麦克风（仍保留按 Enter 录音的兼容行为）
  # - hybrid：优先语音，失败后回退键盘
  # - wake_word：自动短录音监听“小航小航”，唤醒后录正式指令
  input_mode: "wake_word"

  # 当前只实现固定时长录音。
  record_mode: "fixed"
  record_seconds: 3
  sample_rate: 16000
  channels: 1
  language: "zh"

  # null 表示使用系统默认麦克风。
  input_device: null

  # ------------------------------------------------------------
  # Wake Word：默认使用 sherpa-onnx 本地 KWS，simple_asr/mock 保留为兜底
  # ------------------------------------------------------------
  wake_word:
    enabled: true
    engine: "sherpa_onnx"
    keyword: "小航小航"
    reply: "我在"
    command_record_seconds: 3.5
    wake_reply_grace_seconds: 0.2

    # simple_asr 回退参数
    wake_record_seconds: 2.0
    cooldown_sec: 0.3

    # sherpa-onnx 本地中文 KWS
    sherpa_onnx:
      model_dir: "models/kws/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01"
      keywords_file: "configs/kws/keywords.txt"
      sample_rate: 16000
      num_threads: 2
      provider: "cpu"
      max_active_paths: 4
      audio_block_size: 0.1
      tail_padding_seconds: 0.3

  # ------------------------------------------------------------
  # ASR：语音识别
  # ------------------------------------------------------------
  asr:
    backend: "faster_whisper"

    # 模型大小：tiny/base 更快，small 更准但更慢。
    model_size: "small"

    # 当前 PC CPU 调试推荐 cpu + int8。
    device: "cpu"
    compute_type: "int8"

    # 中文短指令解码参数。
    beam_size: 5
    best_of: 5
    condition_on_previous_text: false
    initial_prompt: "以下是普通话中文语音指令，内容与智能家居、开灯、关灯、起夜、找药、报警、跌倒、摔倒、挥手、鼓掌、飞吻、停止有关。请输出简体中文。"

  # ------------------------------------------------------------
  # TTS：系统语音输出
  # ------------------------------------------------------------
  tts:
    enabled: true

    # TTS 后端：
    # - print：只打印，不发声
    # - pyttsx3：PC 离线 TTS
    # - edge_tts：PC 端微软在线 TTS
    # - g1_http：通过 robot.proxy_base_url 调 G1 本体发声
    backend: "g1_http"

    # g1_http 配置。G1 地址只在 robot.proxy_base_url 中配置，不要在这里重复写。
    g1_speaker_id: 0

    # G1 TTS 失败、冷却中或离线时的 PC 端兜底。
    # fallback_backend 可选：print / edge_tts / pyttsx3。
    fallback_backend: "print"
    fallback_to_pc_tts: true
    cooldown_retry_ms: 0

    # edge_tts / pyttsx3 共用的语音参数。
    voice: "zh-CN-XiaoxiaoNeural"
    rate: "-10%"
    volume: "+0%"

  # ------------------------------------------------------------
  # 语音兜底
  # ------------------------------------------------------------
  fallback:
    # ASR 失败时允许回退到键盘输入。
    text_input_on_asr_fail: true

    # TTS 失败时至少打印回复文本，避免主控“无反馈”。
    print_reply_if_tts_fail: true
