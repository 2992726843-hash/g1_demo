# ============================================================
# G1 适老化智能家居系统 - 主配置文件
# 文件作用：
#   1. 配置机器人网络连接信息
#   2. 配置 Home Assistant 地址
#   3. 配置当前运行模式 mock / real
#   4. 配置大模型 LLM 接口
#   5. 配置语音输入输出模块
#
# 注意：
#   - 本文件可能包含 API Key / Token 等敏感信息
#   - 不建议直接上传到 GitHub
#   - 后续建议建立 system_config.example.yaml，
#     并把真实 system_config.yaml 加入 .gitignore
# ============================================================


# ============================================================
# 机器人配置
# ============================================================
robot:
  # 机器人或主控通信相关 IP。
  #
  # 注意：
  #   这里需要根据你实际的通信方向来确认。
  #   如果当前代码中 real_g1.py / Unitree SDK 读取的是 robot.ip，
  #   那么这里通常应填写“机器人当前无线 IP”或有线通信 IP。
  #
  # 示例：
  #   1. 电脑有线连接机器人时：
  #      ip: "10.68.182.180"
  #
  #   2. 无线连接机器人时：
  #      ip: "机器人当前无线IP"
  #
  #   3. 如果这里实际被你的代码用作“本机网卡 IP”，
  #      则需要填写电脑当前对应网卡的 IP。
  #
  # 建议：
  #   真机联调前，用 ifconfig / ip addr 查看电脑和机器人 IP，
  #   并确认代码里 robot.ip 到底传给了哪个 SDK 初始化函数。
  ip: "10.68.182.180"

  # 本机用于和 G1 通信的网络接口名称。
  #
  # 常见情况：
  #   - 有线网卡：enp108s0、eth0、enx...
  #   - 无线网卡：wlo1、wlan0...
  #
  # 你的当前说明：
  #   - 无线连接机器人时：wlo1
  #   - 有线连接机器人时：enp108s0
  #
  # 查看方法：
  #   ip addr
  #   或：
  #   ifconfig
  #
  # 注意：
  #   不同电脑、不同系统安装后，网卡名可能不一样。
  #   如果 SDK 初始化失败，优先检查这里。
  network_interface: "enp108s0"


# ============================================================
# Home Assistant 配置
# ============================================================
home_assistant:
  # Home Assistant 服务地址。
  #
  # 当前配置：
  #   http://127.0.0.1:8123
  #
  # 含义：
  #   Home Assistant 运行在本机，也就是主控 PC 上。
  #
  # 如果 Home Assistant 跑在其他电脑或服务器上，
  # 需要改成对应局域网 IP，例如：
  #   url: "http://192.168.1.20:8123"
  url: "http://127.0.0.1:8123"

  # Home Assistant 长期访问令牌。
  #
  # 用途：
  #   主控或 iot_service 通过 REST API 控制灯、插座、灯带等设备。
  #
  # 注意：
  #   这是敏感信息，不要上传 GitHub。
  #   当前 your_token_here 是占位符，真实联调时需要换成 HA 中生成的 Long-Lived Access Token。
  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJmMmQyNzBhMWY1YmM0YWUxODQ0ZTBkZGEzZGZhMGQzZCIsImlhdCI6MTc3NzAyNTIxNCwiZXhwIjoyMDkyMzg1MjE0fQ._7i5W7m8ZLtI5hNpUZCy9OWiqJeJPak7kGLSD3u2A1k"


# ============================================================
# 系统运行模式
# ============================================================
# mock：
#   开发模式 / 无机器人模式。
#   使用 hardware/mock_g1.py 模拟机器人动作，不需要真机。
#
# real：
#   真机模式。
#   使用 hardware/real_g1.py 和 Unitree SDK2 控制 G1。
#
# 建议：
#   - 平时开发、测试 IoT、测试语音时用 mock
#   - 真机联调 G1 动作时再改成 real
mode: "mock"


# ============================================================
# LLM 大模型配置
# ============================================================
llm:
  # 阿里云通义千问 OpenAI 兼容接口地址。
  #
  # 当前使用 DashScope compatible-mode。
  # qwen_client.py 会通过这个地址调用模型做自然语言意图解析。
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

  # 阿里云通义千问 API Key。
  #
  # 重要：
  #   这里是敏感密钥。
  #   如果这是你的真实 key，建议立刻：
  #     1. 不要提交到 GitHub
  #     2. 后续改为从环境变量读取
  #     3. 创建 system_config.example.yaml 放占位符
  #
  # 示例环境变量方式：
  #   export DASHSCOPE_API_KEY="你的真实key"
  #
  # 然后代码中读取：
  #   os.getenv("DASHSCOPE_API_KEY")
  api_key: "sk-107dd8da7c7649049e36c82120a6ede6"

  # 使用的模型名称。
  #
  # 常见可选：
  #   - qwen-plus：综合效果较好，适合意图解析
  #   - qwen-turbo：速度更快，成本更低
  #   - qwen-max：能力更强，但可能更慢/更贵
  #
  # 当前项目中，常用养老指令建议优先走本地 shortcut，
  # 复杂自然语言再交给 LLM。
  model_name: "qwen-plus"


# ============================================================
# 语音模块配置（PC 端基础版，可后续迁移到 G1）
# ============================================================
speech:
  # 是否启用语音模块。
  #
  # true：
  #   启用语音输入 / 语音播报。
  #
  # false：
  #   不启用语音模块，系统退回纯文本 input + print。
  enabled: true

  # 输入模式。
  #
  # text：
  #   只使用键盘输入，最稳定，适合排查主控逻辑。
  #
  # voice：
  #   只使用语音输入。
  #   如果 ASR 失败，可能本轮没有输入。
  #
  # hybrid：
  #   优先语音输入；
  #   如果没有识别到文本，则回退到键盘输入。
  #
  # 推荐：
  #   开发联调阶段使用 hybrid。
  input_mode: "hybrid"

  # 录音模式。
  #
  # fixed：
  #   按 Enter 后录固定时长。
  #
  # 当前基础版建议使用 fixed。
  # 后续如果要做按住说话、唤醒词、连续监听，可以再扩展。
  record_mode: "fixed"

  # 每次录音的时长，单位：秒。
  #
  # 老人常用指令一般较短，例如：
  #   - 我想起夜
  #   - 帮我找药
  #   - 打开卧室的灯
  #   - 测试跌倒
  #
  # 4 秒通常够用。
  # 如果经常说不完，可以改成 5 或 6。
  record_seconds: 4

  # 录音采样率。
  #
  # 16000 是语音识别常用采样率，速度和效果比较平衡。
  sample_rate: 16000

  # 声道数。
  #
  # 1 表示单声道。
  # ASR 一般不需要双声道。
  channels: 1

  # 识别语言。
  #
  # zh 表示中文。
  # 当前项目只面向中文养老场景，所以固定 zh 即可。
  language: "zh"

  # 输入设备 ID。
  #
  # null：
  #   使用系统默认麦克风。
  #
  # 如果后续在 G1 或其他设备上有多个麦克风，
  # 可以通过脚本列出音频设备后，把对应设备 ID 填到这里。
  #
  # 例如：
  #   input_device: 2
  input_device: null


  # ------------------------------------------------------------
  # ASR：语音识别配置
  # ------------------------------------------------------------
  asr:
    # ASR 后端。
    #
    # 当前基础版使用 faster_whisper。
    # 它负责把 wav 音频转成中文文本。
    backend: "faster_whisper"

    # Whisper 模型大小。
    #
    # 常见选择：
    #   tiny：
    #     速度最快，占用最低，但准确率相对低。
    #
    #   base：
    #     速度较快，准确率比 tiny 好。
    #
    #   small：
    #     准确率更好，但 CPU 上会慢一些。
    #
    # 推荐：
    #   - PC 有性能时：small
    #   - G1 Orin 上先尝试：tiny 或 base
    #   - 如果响应太慢：改成 tiny
    model_size: "small"

    # 推理设备。
    #
    # cpu：
    #   最稳，不依赖 CUDA 环境。
    #
    # cuda：
    #   理论上更快，但要求 CUDA / cuBLAS / CTranslate2 版本匹配。
    #
    # auto：
    #   代码自动尝试 cuda，失败后回退 cpu。
    #
    # 当前你之前遇到 libcublas.so.12 缺失，
    # 所以这里先用 cpu 更稳。
    device: "cpu"

    # 计算精度。
    #
    # int8：
    #   CPU 上推荐，速度较快，占用较低。
    #
    # float16：
    #   CUDA 上常用。
    #
    # auto：
    #   让代码根据 device 自动选择。
    #
    # 当前 CPU 模式下推荐 int8。
    compute_type: "int8"


  # ------------------------------------------------------------
  # TTS：语音播报配置
  # ------------------------------------------------------------
  tts:
    # 是否启用 TTS 播报。
    #
    # true：
    #   系统回复时尝试语音播报。
    #
    # false：
    #   只 print，不播放声音。
    enabled: true

    # TTS 后端。
    #
    # print：
    #   只打印，不真实发声。
    #   最稳定，适合开发调试。
    #
    # pyttsx3：
    #   离线 TTS。
    #   优点是不依赖网络；
    #   缺点是 Ubuntu 中文声音可能很差。
    #
    # edge_tts：
    #   使用微软中文神经语音。
    #   中文自然度较高，适合比赛视频展示；
    #   但需要网络，并且需要播放器支持。
    #
    # 当前推荐：
    #   - 调试主控：print
    #   - 展示视频：edge_tts
    #   - 离线兜底：pyttsx3
    backend: "edge_tts"

    # edge_tts 中文声音。
    #
    # 推荐：
    #   zh-CN-XiaoxiaoNeural：女声，比较自然、亲和
    #   zh-CN-YunyangNeural：男声，更沉稳
    #
    # 适老化场景建议使用语速稍慢、声音温和的音色。
    voice: "zh-CN-XiaoxiaoNeural"

    # edge_tts 语速。
    #
    # "-10%" 表示比默认慢 10%。
    # 适老化场景建议慢一点，老人更容易听清。
    #
    # 可选示例：
    #   "-20%"：更慢
    #   "-10%"：略慢，推荐
    #   "+0%" ：默认速度
    rate: "-10%"

    # edge_tts 音量。
    #
    # "+0%" 表示默认音量。
    # 如果现场较吵，可以尝试 "+10%"。
    volume: "+0%"


  # ------------------------------------------------------------
  # 兜底策略
  # ------------------------------------------------------------
  fallback:
    # ASR 失败时是否回退到文本输入。
    #
    # true：
    #   语音没识别出来时，终端提示用户手动输入。
    #
    # false：
    #   语音识别失败则本轮输入为空。
    #
    # 推荐开发阶段保持 true。
    text_input_on_asr_fail: true

    # TTS 失败时是否至少打印回复文本。
    #
    # true：
    #   如果 edge_tts / pyttsx3 播报失败，
    #   系统仍然 print 回复，避免用户完全不知道系统结果。
    #
    # 推荐保持 true。
    print_reply_if_tts_fail: true